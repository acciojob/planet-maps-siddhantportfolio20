<!DOCTYPE html>
<html>
<head>
    <title>Planet Maps</title>
</head>
<body>

    <img src="solarsystem.jpg" usemap="#planetmap" alt="Solar System">

    <map name="planetmap">

        <!-- Sun -->
        <area
            shape="rect"
            coords="x1,y1,x2,y2"
            href="sun.htm"
            alt="Sun"
        >

        <!-- Mercury -->
        <area
            shape="circle"
            coords="x,y,r"
            href="mercury.htm"
            alt="Mercury"
        >

        <!-- Venus -->
        <area
            shape="circle"
            coords="x,y,r"
            href="venus.htm"
            alt="Venus"
        >

        <!-- Earth -->
        <area
            shape="circle"
            coords="x,y,r"
            href="earth.htm"
            alt="Earth"
        >

        <!-- Mars -->
        <area
            shape="circle"
            coords="x,y,r"
            href="mars.htm"
            alt="Mars"
        >

        <!-- Jupiter -->
        <area
            shape="circle"
            coords="x,y,r"
            href="jupiter.htm"
            alt="Jupiter"
        >

        <!-- Saturn -->
        <area
            shape="circle"
            coords="x,y,r"
            href="saturn.htm"
            alt="Saturn"
        >

        <!-- Uranus -->
        <area
            shape="circle"
            coords="x,y,r"
            href="uranus.htm"
            alt="Uranus"
        >

        <!-- Neptune -->
        <area
            shape="circle"
            coords="x,y,r"
            href="neptune.htm"
            alt="Neptune"
        >

        <!-- Pluto -->
        <area
            shape="circle"
            coords="x,y,r"
            href="pluto.htm"
            alt="Pluto"
        >

        <!-- Dwarf planet -->
        <area
            shape="circle"
            coords="x,y,r"
            href="dwarfplanet.htm"
            alt="Dwarf Planet"
        >

    </map>

</body>
</html>
